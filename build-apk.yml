name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Cada ejecucion produce un versionCode mayor: Play rechaza codigos repetidos
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.COLABELLA_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v5

      - name: Descomprimir el proyecto
        run: |
          ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: no hay ningun .zip en el repositorio."
            find . -path ./.git -prune -o -print | head -40
            exit 1
          fi
          echo "Usando: $ZIP"
          mkdir -p src
          unzip -oq "$ZIP" -d src

      - name: Localizar el proyecto
        id: find
        run: |
          FILE=$(find src -name settings.gradle | head -1)
          if [ -z "$FILE" ]; then
            echo "ERROR: el zip no contiene settings.gradle."
            find src | head -40
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Proyecto en: $DIR"
          echo "--- Archivos del modulo app ---"
          ls -la "$DIR/app"
          echo "--- app/build.gradle ---"
          cat "$DIR/app/build.gradle"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Compilar APK de debug
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/assembleDebug.log"; then
            # Publica el motivo del fallo como anotacion, visible en el resumen de la ejecucion
            MSG=$( { grep -E "^(ERROR|e: )|error:" "$RUNNER_TEMP/assembleDebug.log" | head -15; grep -A 25 "What went wrong" "$RUNNER_TEMP/assembleDebug.log"; } | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Fallo al compilar el APK::$MSG"
            exit 1
          fi

      # Google Play rechaza apps con librerias nativas (.so) que no esten alineadas
      # a 16 KB. Las mete Firebase/AndroidX; este paso avisa si una actualizacion
      # de libreria rompe la alineacion, antes de llegar a Play Console.
      - name: Verificar compatibilidad con 16 KB
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          python3 - app/build/outputs/apk/debug/app-debug.apk << 'PYEOF'
          import sys, zipfile, struct
          z = zipfile.ZipFile(sys.argv[1]); malos = []; total = 0
          for info in z.infolist():
              if not info.filename.endswith('.so'):
                  continue
              data = z.read(info)
              if data[:4] != b'\x7fELF' or data[4] != 2:
                  continue  # solo cuentan las de 64 bits
              total += 1
              phoff = struct.unpack_from('<Q', data, 0x20)[0]
              phentsize, phnum = struct.unpack_from('<HH', data, 0x36)
              for i in range(phnum):
                  off = phoff + i * phentsize
                  if struct.unpack_from('<I', data, off)[0] == 1:
                      if struct.unpack_from('<Q', data, off + 48)[0] < 16384:
                          malos.append(info.filename)
                          break
          print(f"Librerias nativas de 64 bits: {total}")
          if malos:
              for m in malos:
                  print(f"::error title=Libreria no compatible con 16 KB::{m}")
              sys.exit(1)
          print("Todas compatibles con paginas de 16 KB")
          PYEOF

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: colabella-petclub-debug
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---- Version para Google Play (AAB firmado) ----
      # Solo se ejecuta si el repositorio tiene los secretos del keystore (ver README).
      - name: Restaurar keystore de subida
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/colabella.jks"
          echo "COLABELLA_KEYSTORE=$RUNNER_TEMP/colabella.jks" >> $GITHUB_ENV

      - name: Compilar AAB de release firmado
        if: env.KEYSTORE_B64 != ''
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          COLABELLA_KEYSTORE_PASSWORD: ${{ secrets.COLABELLA_KEYSTORE_PASSWORD }}
          COLABELLA_KEY_ALIAS: ${{ secrets.COLABELLA_KEY_ALIAS }}
          COLABELLA_KEY_PASSWORD: ${{ secrets.COLABELLA_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle bundleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/bundleRelease.log"; then
            # Publica el motivo del fallo como anotacion, visible en el resumen de la ejecucion
            MSG=$( { grep -E "^(ERROR|e: )|error:" "$RUNNER_TEMP/bundleRelease.log" | head -15; grep -A 25 "What went wrong" "$RUNNER_TEMP/bundleRelease.log"; } | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Fallo al compilar el AAB::$MSG"
            exit 1
          fi

      - name: Publicar AAB para Google Play
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: colabella-petclub-release-aab
          path: |
            ${{ steps.find.outputs.dir }}/app/build/outputs/bundle/release/app-release.aab
            ${{ steps.find.outputs.dir }}/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Borrar keystore del runner
        if: always() && env.KEYSTORE_B64 != ''
        run: rm -f "$RUNNER_TEMP/colabella.jks"
