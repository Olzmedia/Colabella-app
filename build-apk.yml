name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Cada ejecucion produce un versionCode mayor: Play rechaza codigos repetidos
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.COLABELLA_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v5

      - name: Descomprimir el proyecto
        run: |
          ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: no hay ningun .zip en el repositorio."
            find . -path ./.git -prune -o -print | head -40
            exit 1
          fi
          echo "Usando: $ZIP"
          mkdir -p src
          unzip -oq "$ZIP" -d src

      - name: Localizar el proyecto
        id: find
        run: |
          FILE=$(find src -name settings.gradle | head -1)
          if [ -z "$FILE" ]; then
            echo "ERROR: el zip no contiene settings.gradle."
            find src | head -40
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Proyecto en: $DIR"
          echo "--- Archivos del modulo app ---"
          ls -la "$DIR/app"
          echo "--- app/build.gradle ---"
          cat "$DIR/app/build.gradle"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Compilar APK de debug
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: colabella-petclub-debug
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---- Version para Google Play (AAB firmado) ----
      # Solo se ejecuta si el repositorio tiene los secretos del keystore (ver README).
      - name: Restaurar keystore de subida
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/colabella.jks"
          echo "COLABELLA_KEYSTORE=$RUNNER_TEMP/colabella.jks" >> $GITHUB_ENV

      - name: Compilar AAB de release firmado
        if: env.KEYSTORE_B64 != ''
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          COLABELLA_KEYSTORE_PASSWORD: ${{ secrets.COLABELLA_KEYSTORE_PASSWORD }}
          COLABELLA_KEY_ALIAS: ${{ secrets.COLABELLA_KEY_ALIAS }}
          COLABELLA_KEY_PASSWORD: ${{ secrets.COLABELLA_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon

      - name: Publicar AAB para Google Play
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: colabella-petclub-release-aab
          path: |
            ${{ steps.find.outputs.dir }}/app/build/outputs/bundle/release/app-release.aab
            ${{ steps.find.outputs.dir }}/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Borrar keystore del runner
        if: always() && env.KEYSTORE_B64 != ''
        run: rm -f "$RUNNER_TEMP/colabella.jks"
